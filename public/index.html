<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15372c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tee Times">
  <title>Richmond Tee Times</title>
  <script>
    (() => {
      const key = "tee-times-color-theme";
      try { document.documentElement.dataset.theme = localStorage.getItem(key) === "dark" ? "dark" : "light"; } catch {}
      document.addEventListener("DOMContentLoaded", () => {
        const toggle = document.getElementById("theme-toggle");
        toggle.checked = document.documentElement.dataset.theme === "dark";
        toggle.addEventListener("change", () => {
          document.documentElement.dataset.theme = toggle.checked ? "dark" : "light";
          try { localStorage.setItem(key, document.documentElement.dataset.theme); } catch {}
        });
      });
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="golf-icon.svg">
  <link rel="apple-touch-icon" href="golf-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=20260925-fixed-map">
</head>
<body>
  <div id="pull-refresh" class="pull-refresh" aria-hidden="true"><span class="pull-refresh-icon">&#8635;</span><span id="pull-refresh-label">Pull to refresh</span></div>
  <header class="site-header">
    <label class="theme-switch"><input id="theme-toggle" type="checkbox" role="switch">Dark mode</label>
    <div class="header-actions">
      <div class="header-nav-tabs" role="tablist">
        <button id="tab-list" class="nav-tab active" role="tab" aria-selected="true">List view</button>
        <button id="tab-map" class="nav-tab" role="tab" aria-selected="false">Map view</button>
      </div>
      <button id="refresh" class="refresh-action" title="Refresh tee times">
        <span id="refresh-label">Click to refresh tee times</span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5M4 13a8.1 8.1 0 0 0 15.5 2m.5 5v-5h-5"/></svg>
      </button>
      <span id="feed-status" class="feed-status">Loading live sources</span>
    </div>
  </header>

    <main id="top">
    <section id="view-list-container">
    <section class="date-strip" aria-label="Choose a date">
      <button class="date-option active" data-date="">All dates</button>
      <div id="date-options"></div>
    </section>

    <div class="workspace">
      <section class="filters" aria-label="Tee time filters">
        <div class="filter-body">
        <fieldset>
          <legend>Players</legend>
          <div class="segmented" id="players-filter">
            <button class="active" data-players="0">All</button><button data-players="1">1</button><button data-players="2">2</button>
            <button data-players="3">3</button><button data-players="4">4</button>
          </div>
        </fieldset>

        <fieldset class="time-filter" aria-label="Time of day">
          <output id="earliest-output" hidden>5:00 AM</output><output id="latest-output" hidden>8:00 PM</output>
          <div class="time-selects">
            <label>From<select id="earliest" aria-label="Earliest tee time"></select></label>
            <label>Until<select id="latest" aria-label="Latest tee time"></select></label>
          </div>
        </fieldset>

        <fieldset aria-label="Course group">
          <div class="segmented course-groups" id="course-groups">
            <button type="button" data-group="local" class="active" aria-pressed="true">Local</button>
            <button type="button" data-group="regional" aria-pressed="false">Regional</button>
            <button type="button" data-group="all" aria-pressed="false">All</button>
          </div>
        </fieldset>
        <details class="course-picker"><summary>Choose courses <span id="course-selection-count"></span></summary>
          <div class="course-selection-actions"><button type="button" id="show-courses">Select all</button><button type="button" id="hide-courses">Deselect all</button></div>
          <div id="course-selection"></div>
        </details>
        </div>
      </section>

      <section class="results-panel" aria-live="polite">
        <div class="results-head">
          <div class="result-actions">
            <label class="sort-control">Sort
              <select id="sort">
                <option value="price" selected>Lowest price</option>
                <option value="time">Earliest time</option>
                <option value="distance">Nearest</option>
                <option value="course">Course name</option>
              </select>
            </label>
            <div class="disclosure-actions" aria-label="Result display">
              <button id="expand-results" type="button">Expand all</button>
              <button id="collapse-results" type="button">Collapse all</button>
            </div>
          </div>
        </div>

        <div class="metrics" id="metrics"></div>
        <div id="results" class="results"><div class="loading">Checking local tee sheets...</div></div>
      </section>
    </div>

    <section class="coverage-section">
      <div class="section-heading"><h2>Tracked around Richmond</h2></div>
      <div id="course-directory" class="course-directory"></div>
    </section>
    <section class="coverage-section">
      <div class="section-heading"><h2>Other Local Golf</h2></div>
      <div id="other-course-directory" class="course-directory"></div>
    </section>
    </section>

    <section id="view-map-container" class="map-view-hidden">
      <div class="map-layout">
        <div class="map-topbar">
          <section class="date-strip map-date-strip" aria-label="Choose a date">
            <button class="date-option active" data-date="">All dates</button>
            <div id="map-date-options"></div>
          </section>
          <span id="map-count" class="map-count-badge">0 courses</span>
        </div>
        <div class="map-container-wrap">
          <div id="leaflet-map" class="map-canvas"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <template id="metric-template"><div class="metric"><span></span><strong></strong></div></template>
  <script type="module" src="app.js?v=20260926-selected-map"></script>
</body>
</html>
