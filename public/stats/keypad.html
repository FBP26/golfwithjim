<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score Keypad · Golf Stats</title>
<meta name="theme-color" content="#15392a">
<link rel="icon" href="../golf-icon.svg">
<link rel="stylesheet" href="golf.css?v=20261122e">
<link rel="stylesheet" href="keypad.css?v=20261122e">
</head>
<body>
<div class="kp" id="app">
  <section id="setup" class="screen" aria-labelledby="setup-title" hidden>
    <h1 id="setup-title" class="sr">New scorecard</h1>
    <div class="kp-body">
      <div class="toprow">
        <div>
          <span class="lab" id="date-lab">Date</span>
          <label class="datebtn">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
            <span id="date-text"></span>
            <input id="date" type="date" aria-labelledby="date-lab">
          </label>
        </div>
        <a class="homelink" href="../">← Golf With Jim</a>
      </div>

      <label class="lab" for="course-more">Course</label>
      <select id="course-more" class="inp"></select>

      <span class="lab" id="tee-lab">Tees</span>
      <div class="tees" id="tee-chips" role="group" aria-labelledby="tee-lab"></div>

      <span class="lab" id="player-lab">Players <span id="player-count"></span></span>
      <div class="chips" id="player-chips" role="group" aria-labelledby="player-lab"></div>
      <div class="chips sugg" id="player-sugg" aria-live="polite"></div>
      <div class="addrow">
        <label class="sr" for="player-add">Add a player</label>
        <input id="player-add" class="inp" placeholder="Add a player" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="words" aria-describedby="player-sugg">
        <button type="button" class="btn" id="player-add-btn">Add</button>
      </div>
      <p class="hint" id="setup-note"></p>
    </div>
    <footer class="kp-foot"><button type="button" class="btn primary big" id="start">Start</button></footer>
  </section>

  <section id="card" class="screen" hidden>
    <header class="kp-top tight">
      <div class="whorow"><div class="who" id="who" role="group" aria-label="Golfers"></div><span id="sync" class="sync" role="status"></span></div>
      <div class="line"><span id="course-line"></span><b id="topar-line"></b></div>
    </header>
    <div class="nines" id="nines"></div>
    <p class="toast-line" id="toast-line" role="status"></p>

    <div id="keys" class="keys">
      <div class="holehead"><h2 id="hole-title">Hole 1</h2><span id="hole-par"></span><span class="muted" id="hole-meta"></span><span class="muted rnd" id="round-tag"></span></div>
      <div class="row3" id="toggles"></div>
      <div class="row3 results" id="results"></div>
      <div class="row3 small">
        <button type="button" class="btn" id="back">‹ Back</button>
        <button type="button" class="btn" id="albatross"></button>
        <button type="button" class="btn dashed" id="skip">Skip</button>
      </div>
    </div>

    <div id="review" class="review" hidden>
      <div class="sum" id="sum"></div>
      <h2 class="lab">Look again <span id="check-count"></span></h2>
      <div id="checks" class="checks"></div>
      <p class="hint" id="save-state" role="status"></p>
      <div class="row2 foot"><button type="button" class="btn" id="edit-holes">Edit holes</button><button type="button" class="btn primary" id="save-next"></button></div>
    </div>
    <div class="after" id="after">
      <button type="button" class="btn soft" id="more">+ More holes here today</button>
      <button type="button" class="btn" id="new-card">New round: other course or day</button>
    </div>
  </section>

  <p id="loading" class="loading">Loading courses…</p>
</div>

<dialog id="key-dialog">
  <form method="dialog" class="key-form">
    <h2>Score-entry passcode</h2>
    <p class="muted">Only you can save scores. Enter the passcode once on this device.</p>
    <label class="field">Passcode<input id="key-input" type="password" autocomplete="current-password" required></label>
    <div class="row"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save passcode</button></div>
  </form>
</dialog>
<script type="module" src="keypad.js?v=20261122e"></script>
</body>
</html>
