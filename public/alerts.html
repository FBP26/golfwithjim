<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://golfwithjim-alerts.fbp-api-worker.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Golf With Jim | My Alerts</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#15372c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="golf-icon.png">
  <link rel="stylesheet" href="alerts.css?v=20260926-push">
</head>
<body>
  <header>
    <nav class="header-nav-tabs" aria-label="Views">
      <a class="nav-tab" href="./">List</a>
      <a class="nav-tab" href="./?view=map">Map</a>
      <a class="nav-tab active" href="alerts.html" aria-current="page">Alerts</a>
    </nav>
    <div class="alert-heading"><h1>My Alerts</h1></div>
    <span>Push notifications</span>
  </header>
  <main>
    <p id="status" role="status">Loading your alerts...</p>
    <section class="notifications" aria-labelledby="notification-heading">
      <h2 id="notification-heading">This device</h2>
      <p id="notification-status" role="status">Checking notification support...</p>
      <div class="notification-actions"><button id="enable-notifications" type="button" disabled>Enable notifications</button><button id="test-notification" type="button" hidden>Send test notification</button><button id="disable-notifications" type="button" hidden>Disable on this device</button></div>
    </section>
    <form id="preferences" hidden>
      <div class="toolbar"><label><input id="paused" type="checkbox">Pause all alerts</label><span>Eastern time · 18 holes · Price per golfer</span></div>
      <div id="rules"></div>
      <div class="actions"><button id="add" type="button">Add alert</button><button id="save" type="submit">Save changes</button></div>
    </form>
  </main>
  <script type="module" src="alerts.js?v=20260926-push"></script>
  <script type="module" src="notifications.js?v=20260926-push-ready"></script>
</body>
</html>
